plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.ironquest.mvp'
    compileSdk 37

    defaultConfig {
        applicationId "com.ironquest.mvp"
        minSdk 26
        targetSdk 37
        versionCode 10
        versionName "0.9.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // Cards por ejercicio en la sesión activa (Apache 2.0, misma familia que el resto de AndroidX).
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    // Android no decodifica GIF animado de forma nativa antes de API 28; minSdk de la app es 26.
    // MIT, trae com.getkeepsafe.relinker:relinker (también MIT) como transitiva.
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.32'

    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
}
